# Local multi-container deployment: Flask web UI + FastAPI public API,
# sharing the SQLite database and ML model artifacts via a bind volume.
#
# NOT executed/validated in the sandbox this project was built in (no Docker
# daemon available there) — run `docker compose up --build` on a machine
# with Docker installed. See docs/08_mlops.md for details and limitations.
version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./app/ml/artifacts:/app/app/ml/artifacts
      - ./logs:/app/logs
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./instance:/app/instance
      - ./app/ml/artifacts:/app/app/ml/artifacts
      - ./logs:/app/logs
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-this-in-production}
    restart: unless-stopped
    depends_on:
      - web
